services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: metahism-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=4321
    stdin_open: true
    tty: true
